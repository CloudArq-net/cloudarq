name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          check-latest: true
      - run: make build
      - run: make vet
      - run: make test
      - name: layer purity (docs/ENGINEERING.md s1)
        run: make purity
      - name: determinism (docs/ENGINEERING.md s2)
        run: make determinism
      - name: internal/eval coverage (docs/ENGINEERING.md s7)
        run: make cover
      - name: forbidden visual idioms (docs/ENGINEERING.md s9)
        run: make css
