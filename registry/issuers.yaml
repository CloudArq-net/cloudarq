# CloudArq issuer registry
#
# Every OIDC issuer a cloud provider can federate to for workload identity: its tenancy
# model, its subject grammar, its claim vocabulary, and the correct scoping condition in
# each cloud's dialect.
#
# Apache-2.0. Machine-readable on purpose -- this file is meant to be depended on, not
# cited. If you maintain a scanner and want these entries, take them.
#
# Four fields appear in no other public catalogue and carry most of the weight:
#
#   aud_controlled_by       who picks the `aud` value. If it is `workload`, then `aud`
#                           is NOT a boundary: anyone who can run a job on that platform
#                           can request a token carrying your audience.
#   vendor_example_verdict  what the vendor's OWN documented example actually admits.
#   control_test            what a deliberately bogus tenant returns. An issuer found by
#                           guessing a path pattern is UNVERIFIED until this is run --
#                           and a discovery document is not proof a tenant exists. Only
#                           the JWKS is. AWS serves a complete, well-formed discovery
#                           document for a UUID that was invented at random.
#   immutable_id_claims     claims carrying numeric IDs rather than names. An issuer with
#                           none has only name-based subjects, so every trust policy
#                           written against it is recyclable after a rename or a delete.
#
# tenancy_model: shared | per_tenant_host | per_tenant_path | unverified
# Every `ok` status below was fetched live with curl on the date in verified_at.
# `unverified` means nobody confirmed it. It never means "absent".
##
# Controlled vocabularies:
#   aud_controlled_by       relying_party | issuer | workload | unverified
#   vendor_example_verdict  scoped | admits_whole_org | admits_any_repo |
#                           admits_any_principal | no_subject_constraint | unverified
#   discovery_status        ok | not_found | error | unverified
#   jwks_status             ok | error | unverified
#   category                ci | iac | runtime | cloud | ai-agent-platform | platform
#
schema_version: 2
census_date: '2026-09-13'
issuers:
- name: Bitbucket Pipelines
  category: ci
  issuer: https://api.bitbucket.org/2.0/workspaces/<workspace>/pipelines-config/identity/oidc
  tenancy_model: per_tenant_path
  discovery_url: https://api.bitbucket.org/2.0/workspaces/<workspace>/pipelines-config/identity/oidc/.well-known/openid-configuration
  discovery_status: unverified
  jwks_uri: unverified
  jwks_status: unverified
  subject_format: <repository_uuid>[:<environment_uuid>]:<step_uuid>
  subject_examples:
  - '{REPOSITORY_UUID}:{STEP_UUID}'
  - '{REPOSITORY_UUID}:{ENVIRONMENT_UUID}:{STEP_UUID}'
  claims: []
  immutable_id_claims:
  - repository_uuid
  - environment_uuid
  - step_uuid
  - workspace_uuid
  aud_controlled_by: issuer
  aud_default: ari:cloud:bitbucket::workspace/<workspace_uuid>
  aud_evidence: Atlassian docs give the audience as "ari:cloud:bitbucket::workspace/{UUID}" - derived
    from the workspace, not chosen by the pipeline. I found no documented way for a pipeline step to override
    it.
  vendor_example_verdict: admits_any_repo
  vendor_example: "\"Condition\": {\n  \"StringLike\": {\n    \"api.bitbucket.org/2.0/workspaces/{WORKSPACE}/pipelines-config/identity/oidc:sub\"\
    : \"{REPO_UUID}:{*}\"\n  }\n}\n"
  vendor_example_note: Atlassian labels this "A basic trust relationship allowing any repository in your
    workspace". It pins a repo UUID and wildcards the rest, so it admits any step and any deployment environment
    of that repo. No aud condition is present in the quoted example, though the audience is workspace-pinned
    anyway.
  self_hosted_variant: n/a - Bitbucket Cloud only. Bitbucket Data Center OIDC not verified.
  docs_url: https://support.atlassian.com/bitbucket-cloud/docs/deploy-on-aws-using-bitbucket-pipelines-openid-connect/
  verified_at: '2026-09-13'
  notes: 'TENANCY CONTROL TEST PASSED. A bogus workspace slug ("foo") and a bogus workspace UUID both
    return HTTP 404 {"type": "error", "error": {"message": "Resource not found"}}. I could not fetch a
    positive discovery document because that requires naming a real workspace, so discovery_status stays
    `unverified` rather than being guessed from the 404 shape. Best-designed subject format in this census:
    every component is an immutable UUID, so no Bitbucket trust policy is name-recyclable.'
  source: wif census 2026-09-13
  vendor: Atlassian Bitbucket
  issuer_pattern: https://api.bitbucket.org/2.0/workspaces/<ws>/pipelines-config/identity/oidc
  control_test: PASSED — bogus workspace returns HTTP 404
  control_test_result: passed
