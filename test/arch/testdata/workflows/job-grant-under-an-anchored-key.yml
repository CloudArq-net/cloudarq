# Refused as unreadable: the job's permissions key carries an anchor before
# it, which YAML reads as the key permissions and this check does not
# follow.
name: check
on: pull_request_target

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    &grant permissions: write-all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: make check
