# Refused as unreadable, read as release.yml: the check job's grant carries
# an anchor and the build job's is an alias of it. The check does not
# follow either, so it cannot say what either job holds.
name: release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: &attest
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: make check
  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: *attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: build the release files
        run: |
          make release VERSION="$GITHUB_REF_NAME"
          cat dist/release/*/SHA256SUMS
